<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ar Risalah Archery Trainer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0f14;
    color:white;
    font-family:Segoe UI,Tahoma,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:90%;
    max-width:500px;
    text-align:center;
}

.screen{
    display:none;
    animation:fadeIn 1s;
}

.screen.active{
    display:block;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

h1{
    color:#ffd700;
    margin-bottom:20px;
    line-height:1.5;
}

h2{
    color:#ffd700;
    margin-bottom:20px;
}

p{
    color:#ccc;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:15px;
    text-align:left;
}

label{
    display:block;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1c2330;
    color:white;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.btn-start{
    background:#ffd700;
    color:black;
}

.btn-stop{
    background:#d10000;
    color:white;
}

.status{
    margin-top:20px;
    font-size:36px;
    color:#00ff88;
    font-weight:bold;
    text-shadow:0 0 15px #00ff88;
}

.sub{
    color:#aaaaaa;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="container">


<!-- Screen 1 -->
<div id="screen1" class="screen active">
    <h1>
        Selamat Berlatih Panahan<br>
        Bersama Ar Risalah Archery
    </h1>
</div>

<!-- Screen 2 -->
<div id="screen2" class="screen">
    <h1>
        Anda akan melakukan latihan dinamis.
        Tembaklah target yang disebutkan.
        Bersiap siagalah ... !
    </h1>
</div>

<!-- Screen 3 -->
<div id="screen3" class="screen">

    <h2>Pengaturan Latihan</h2>

    <div class="form-group">
        <label>Jumlah Target (1-8)</label>
        <input type="number" id="jumlahTarget" min="1" max="8" value="3">
    </div>

    <div class="form-group">
        <label>Rentang Waktu 1 (detik)</label>
        <input type="number" id="t1" value="2">
    </div>

    <div class="form-group">
        <label>Rentang Waktu 2 (detik)</label>
        <input type="number" id="t2" value="7">
    </div>

    <button class="btn-start" onclick="mulaiLatihan()">
        MULAI
    </button>

</div>

<!-- Screen 4 -->
<div id="screen4" class="screen">

    <h1>Latihan Berjalan</h1>

    <p>Target secara acak...</p>

    <p>Dengarkan instruksi</p>

    <div id="status" class="status">
        FOKUS...
    </div>

    <br>

    <button class="btn-stop" onclick="stopLatihan()">
        SELESAI
    </button>

</div>


</div>

<script>

function tampil(id){

    document.querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

    document
    .getElementById(id)
    .classList.add("active");
}

/* Pembuka */

setTimeout(()=>{
    tampil("screen2");

    setTimeout(()=>{
        tampil("screen3");
    },5000);

},3000);


/* Audio */

const audioTargets={};

for(let i=1;i<=8;i++){

    audioTargets[i]=new Audio(
    `Archery Manager Audio/target${i}.mp3`
    );

    audioTargets[i].preload="auto";
}


/* Variabel */

let timer=null;
let running=false;
let lastTarget=null;


/* Ambil target acak */

function targetAcak(max){

    let t;

    do{

        t=Math.floor(
            Math.random()*max
        )+1;

    }while(
        max>1 &&
        t===lastTarget
    );

    lastTarget=t;

    return t;
}


/* Main Loop */

function loopTarget(max,t1,t2){

    if(!running) return;

    const delay=
        (Math.random()*(t2-t1)+t1)
        *1000;

    timer=setTimeout(()=>{

        const target=
            targetAcak(max);

        document
        .getElementById("status")
        .innerText=
        "TARGET " + target;

        const audio =
    audioTargets[target];

if(audio){

    audio.pause();
    audio.currentTime = 0;

    audio.play()
    .then(() => {

        // Bip dibunyikan setelah suara target
        setTimeout(() => {
            bunyiBip();
        }, 1200);

    })
    .catch(err=>{
        console.log(err);
    });
}

        loopTarget(max,t1,t2);

    },delay);
}


/* Mulai */

function mulaiLatihan(){

    const jumlah=
    parseInt(
        document
        .getElementById("jumlahTarget")
        .value
    );

    const t1=
    parseFloat(
        document
        .getElementById("t1")
        .value
    );

    const t2=
    parseFloat(
        document
        .getElementById("t2")
        .value
    );

    if(jumlah<1 || jumlah>8){

        alert(
            "Jumlah target harus 1-8"
        );

        return;
    }

    if(t1>=t2){

        alert(
            "Rentang waktu 2 harus lebih besar"
        );

        return;
    }

    running=true;

    tampil("screen4");

    document
    .getElementById("status")
    .innerText=
    "FOKUS...";

    loopTarget(
        jumlah,
        t1,
        t2
    );
}


/* Stop */

function stopLatihan(){

    running=false;

    clearTimeout(timer);

    lastTarget=null;

    tampil("screen3");
}

function bunyiBip(){

    const ctx =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    // Bip pertama
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();

    osc1.connect(gain1);
    gain1.connect(ctx.destination);

    osc1.type = "sine";
    osc1.frequency.value = 400;

    gain1.gain.setValueAtTime(
        0.05,
        ctx.currentTime
    );

    osc1.start(ctx.currentTime);
    osc1.stop(ctx.currentTime + 0.08);

    // Bip kedua
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();

    osc2.connect(gain2);
    gain2.connect(ctx.destination);

    osc2.type = "sine";
    osc2.frequency.value = 700;

    gain2.gain.setValueAtTime(
        0.05,
        ctx.currentTime + 0.12
    );

    osc2.start(ctx.currentTime + 0.12);
    osc2.stop(ctx.currentTime + 0.20);
}

</script>

</body>
</html>
